<style>
/* Fixed + inset:0 so the takeover covers the viewport no matter where in the
   host page's DOM the fragment gets mounted. */
.bday_root {
  position: fixed;
  inset: 0;
  z-index: 9999;
  overflow: hidden;
}

/* The host intranet styles bare `img` (border, margin). Without this reset those
   land on our background and knock it out of alignment — caught in preview.html. */
.bday_root img { display: block; border: 0; margin: 0; }

/* There is deliberately no background layer. This takeover sits ON TOP of the
   live intranet (decided 2026-08-31), so the real page shows through and
   .bday_overlay's backdrop-filter blurs it. The old Assets/background.svg was a
   placeholder standing in for a screenshot and has been deleted — do not add an
   <img> back in, or it will cover the very page this is meant to blur. */
.bday_overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(23, 39, 51, 0.85) 0%,
    rgba(69, 118, 153, 0.85) 100%
  );
  /* This is what makes the takeover work now: it blurs the real intranet
     behind it. 85% alpha on the gradient above sits over that blur. If the
     host page ever ends up unblurred, check for an ancestor that creates a
     containing block — see the reparenting note in the script. */
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
}

/* The message card. Sits above the overlay and below the balloons, so it's
   uncovered as they pop rather than needing any reveal logic of its own.
   No z-index on purpose: it and .bday_overlay are both auto, so DOM order puts
   it above the overlay, while the balloons' inline z-index (1..Z_LEVELS) keeps
   them in front. Giving this a z-index would break that. */
.bday_card {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  /* Fixed 702px per spec. The min() only guards windows narrower than the
     supported 1024 floor — at 1024 the card is still a full 702px. */
  width: min(702px, calc(100vw - 80px));
  /* Never intercept a balloon click — the balloons sit in front of this. */
  pointer-events: none;
}

.bday_card-art { display: block; width: 100%; height: auto; }

/* Sits in the card's blank upper band, above the printed balloons. */
.bday_card-body {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  padding: 48px 48px 0;
  /* Public Sans is expected from the Liferay theme — this fragment must not
     pull a webfont itself (a strict CSP would block the CDN). preview.html
     loads it separately so the harness renders what production will. */
  font-family: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: #172733;
}

.bday_card-title {
  font-size: 32px;
  font-weight: 600;   /* semibold */
  line-height: 120%;
  letter-spacing: -0.1px;
}

/* Descendant-scoped so it outranks the `.bday_root p` reset below, which is
   (0,1,1) and would otherwise flatten this margin back to zero. */
.bday_root .bday_card-text {
  /* Gap between heading and body isn't in the spec — 12px is assumed. */
  margin-top: 12px;
  font-size: 20px;
  font-weight: 400;
  line-height: 150%;
  letter-spacing: -0.1px;
}

/* Host defence: the intranet styles bare h2/p, and our harness proves it by
   setting `p { margin: 0 0 18px }`. Without this the copy inherits it. */
.bday_root h2, .bday_root p { margin: 0; }

/* ── close button ─────────────────────────────────────────────────────
   32x32 per spec. Above the balloons (inline z-index 1..Z_LEVELS = 100) and
   the crosshair layer (300), but below the tracked pin (310) so the cursor
   still paints on top of it, which is where a cursor belongs.

   A real <button>, not a styled div: it must be reachable by Tab and fire on
   Enter/Space without any of that being re-implemented. */
.bday_close {
  position: absolute;
  top: 24px;
  right: 24px;
  z-index: 305;
  width: 32px;
  height: 32px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  /* Host defence: the intranet styles bare `button`. Everything a theme could
     reach in and set is reset here rather than assumed. */
  background: rgba(23, 39, 51, 0.35);
  border: 0;
  border-radius: 50%;
  font: inherit;
  line-height: 0;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: background-color 120ms ease-out;
}
.bday_close:hover { background: rgba(23, 39, 51, 0.6); }
.bday_close:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
/* The icon is stroked, so it scales with the button without re-exporting art. */
.bday_close svg { display: block; width: 16px; height: 16px; }

@media (prefers-reduced-motion: reduce) {
  .bday_close { transition-duration: 0ms; }
}

/* Set by close(). Explicit rather than relying on the UA sheet's [hidden],
   which a host theme's `display` rule can outrank. */
.bday_root[hidden] { display: none; }

/* ── pointer modes ────────────────────────────────────────────────────
   Driven by data-bday-pointer on the root, set via window.bday.setPointer().
   Balloons use cursor:inherit, so setting it here reaches them too.

   "pin"       native cursor, hotspot 3,3 at the needle tip. No rAF, no lag.
   "crosshair" reticle + full-viewport rules, tracked in JS below. Reads as a
               targeting scope, which is a questionable register for a birthday
               — kept switchable so the difference can be judged side by side.
   "default"   the host page's own cursor, untouched. */
.bday_root[data-bday-pointer="pin"] { cursor: url('Assets/pin.svg') 3 3, auto; }
/* "default" leaves the arrow on the backdrop and swaps to the pushpin over a
   balloon — the thing you'd actually pop it with.
   round-pin-48.png is a 48px downscale of Assets/round pin.png, generated
   because a native cursor cannot be scaled by CSS — its size IS the file's
   pixel size — and because Chrome ignores cursor images larger than 128px, so
   pointing at the 512px source would silently fall back to `pointer`.
   Hotspot 0 47 is the needle tip, measured from the artwork's alpha (the tip
   reaches the bottom-left corner, so it tracks size as 0, size-1).
   `pointer` is the fallback if the image is rejected or fails to load. */
.bday_root[data-bday-pointer="default"] { cursor: default; }
.bday_root[data-bday-pointer="default"] .bday_balloon {
  cursor: url('Assets/round-pin-48.png') 0 47, pointer;
}

/* The system cursor is hidden only once a replacement is actually tracking
   (data-bday-cursor for the crosshair, data-bday-pinlive for the pin), so a
   script failure can't leave the user with no cursor. In the pin's case the
   fallback is better still: the native cursor rule above stays in force, so a
   failure degrades to a static pin rather than nothing.
   Fine pointers only: on touch there's nothing to replace. */
@media (hover: hover) and (pointer: fine) {
  .bday_root[data-bday-pointer="crosshair"][data-bday-cursor="1"] { cursor: none; }
  .bday_root[data-bday-pointer="default"][data-bday-pinlive="1"] .bday_balloon { cursor: none; }
}

/* Tracked pin. A native cursor cannot animate — the browser hands the OS a
   static bitmap and renders only the first frame even of an animated image —
   so the press needs a real element following the pointer. */
.bday_pin {
  position: absolute;
  left: 0; top: 0;
  width: 48px;    /* must match round-pin-48.png and PIN_HOTSPOT_Y */
  height: 48px;
  pointer-events: none;
  /* Above the crosshair layer (300) and well above the balloons' inline
     z-index (1..Z_LEVELS). Without this it inherits `auto` and paints behind
     every balloon, which is where a cursor must never be. */
  z-index: 310;
}
.bday_pin[hidden] { display: none; }

/* Two elements on purpose. The wrapper carries the pointer position, the art
   carries the press. They cannot share one transform: the transition below
   would then apply to the position too, easing the pin 90ms behind the mouse
   on every move. */
.bday_pin-art {
  display: block;
  width: 100%;
  height: 100%;
  transition: transform 90ms ease-out;
}

/* Press driven entirely by :has() — no pointerdown/up/cancel handlers, and no
   state to unwind in destroy(). Down-left, along the direction the tip already
   points, so it reads as pushing the pin in rather than sliding it.
   Scales with the pin: 3px is the 64px art's 4px offset at 48px. A fixed offset
   would read as a twitch on a smaller pin and a lurch on a larger one.
   If :has() is unsupported the pin simply doesn't animate; it still tracks. */
.bday_root:has(.bday_balloon:active) .bday_pin-art { transform: translate(-3px, 3px); }

@media (prefers-reduced-motion: reduce) {
  .bday_pin-art { transition-duration: 0ms; }
}

.bday_pointer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 300;
}
.bday_pointer[hidden] { display: none; }

.bday_crosshair {
  position: absolute;
  left: 0; top: 0;
  width: 126px;   /* must match CROSSHAIR_PX and the svg's viewBox */
  height: 126px;
}

/* The four segments run from the crosshair out to the viewport edges. They stop
   at the svg's bounding box, so they meet its arms without overlapping the
   circle inside it. The colour must match the stroke in Assets/crosshair.svg —
   the rules and the arms read as one continuous line, so a mismatch shows as a
   seam at the join. */
.bday_rule { position: absolute; left: 0; top: 0; background: #FF7E65; }
.bday_rule-h { height: 4px; }
.bday_rule-v { width: 4px; }

/* Decorative layer — never intercepts clicks from whatever lands on top later. */
.bday_balloons {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

/* left/top place the centre; the transform does the centring so rotation
   pivots on the balloon's middle rather than its top-left corner. */
.bday_balloon {
  position: absolute;
  /* Driven by a custom property so size can change without a refill. */
  width: var(--bday-balloon-size, 160px);
  height: var(--bday-balloon-size, 160px);
  /* The layer is pointer-events:none so gaps stay click-through; the balloons
     opt back in.
     No clip-path here. An inscribed circle() looks like it would only remove the
     transparent corners, but the shapes differ per colour — Yellow is a star and
     Red is broader than it is tall — so it sliced the tips off: 6.1% of Red's
     opaque pixels, 2.9% of Blue's, 2.2% of Yellow's. Any circle large enough to
     spare them covers the whole box anyway. The cost is that a click on a
     transparent corner still hits this element; see BACKLOG for alpha hit-testing. */
  pointer-events: auto;
  /* Inherit the active pointer mode. In "pin" the pin is itself the affordance,
     so a hand on hover would undercut it; "default" overrides this below. */
  cursor: inherit;

  /* Composed here rather than inline: an inline transform would outrank the
     :hover rule below, and hardcoding it would lose each balloon's own tilt.
     The script sets --bday-tilt per balloon; --bday-scale is the hover hook. */
  transform: translate(-50%, -50%)
             rotate(var(--bday-tilt, 0deg))
             scale(var(--bday-scale, 1));
  /* Default duration is the hover-*out*; :hover overrides it for the way in. */
  transition: transform 50ms ease-out;
}

/* Guarded so a touch device can't get stuck in the hovered state after a tap. */
@media (hover: hover) and (pointer: fine) {
  .bday_balloon:hover { --bday-scale: 1.1; transition-duration: 100ms; }
}

/* Keep the affordance, drop the movement. */
@media (prefers-reduced-motion: reduce) {
  .bday_balloon, .bday_balloon:hover { transition-duration: 0ms; }
}

/* Once it's popping it must stop being a click target, or a second click
   restarts the sequence mid-way. pointer-events:none also drops any hover
   scale, so a popping balloon animates its frames at true size. */
.bday_balloon[data-bday-popping="1"] { pointer-events: none; }
</style>

<div class="bday_root" id="bday_root">
  <!-- No background <img> by design — the live intranet behind this IS the
       background, blurred by .bday_overlay's backdrop-filter. -->
  <div class="bday_overlay"></div>

  <!-- Dismiss. aria-label rather than visible text because the icon is the
       whole control; without it a screen reader announces an unnamed button.
       The <svg> is aria-hidden so it isn't announced separately. -->
  <button class="bday_close" id="bday_close" type="button" aria-label="Close">
    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
      <path d="M2.5 2.5 L13.5 13.5 M13.5 2.5 L2.5 13.5"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>
  <!-- The final message, revealed as the balloons in front of it are popped.
       The artwork is decorative; the message itself is live text so it stays
       readable, translatable and screen-reader accessible. -->
  <div class="bday_card" id="bday_card">
    <img class="bday_card-art" src="Assets/card.png" alt="" aria-hidden="true" />
    <div class="bday_card-body">
      <!-- h2 not h1: this is a fragment inside a host page that has its own h1.

           ╔═══════════════════════════════════════════════════════════════╗
           ║ DEVELOPERS — CHANGE #1 OF 2: THE NAME                         ║
           ║                                                               ║
           ║ "Timothy" below is a PLACEHOLDER. The employee's real name    ║
           ║ arrives from Workday. Replace just that word with whatever    ║
           ║ your Liferay/Workday integration exposes, e.g.                ║
           ║                                                               ║
           ║   <h2 class="bday_card-title">Happy birthday ${firstName}!</h2>║
           ║                                                               ║
           ║ Use the FIRST name only — the layout was measured for one     ║
           ║ short word. A long full name wraps this heading onto a second ║
           ║ line, which is handled (the copy below simply moves down) but ║
           ║ leaves very little clearance above the printed balloons.      ║
           ║                                                               ║
           ║ ESCAPE IT. This is interpolated into HTML, so a name          ║
           ║ containing & or < must be escaped or it will break the card.  ║
           ╚═══════════════════════════════════════════════════════════════╝ -->
      <h2 class="bday_card-title">Happy birthday Timothy!</h2>
      <!-- "this month" is also date-dependent — check it still reads correctly
           if this is ever shown outside the employee's birthday month. -->
      <p class="bday_card-text">Sending you best wishes for your special day and the years ahead. Don't forget to take your birthday leave this month!</p>
    </div>
  </div>
  <div class="bday_balloons" id="bday_balloons" aria-hidden="true"></div>

  <!-- Only populated in crosshair mode; hidden otherwise. -->
  <div class="bday_pointer" id="bday_pointer" aria-hidden="true" hidden>
    <span class="bday_rule bday_rule-h" id="bday_ruleL"></span>
    <span class="bday_rule bday_rule-h" id="bday_ruleR"></span>
    <span class="bday_rule bday_rule-v" id="bday_ruleT"></span>
    <span class="bday_rule bday_rule-v" id="bday_ruleB"></span>
    <img class="bday_crosshair" id="bday_crosshair" src="Assets/crosshair.svg" alt="" />
  </div>

  <!-- Tracked pin, shown over balloons in "default" mode. Lives outside
       .bday_pointer because that layer is owned by the crosshair. -->
  <div class="bday_pin" id="bday_pin" aria-hidden="true" hidden>
    <img class="bday_pin-art" src="Assets/round-pin-48.png" alt="" />
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   DEVELOPERS — READ THIS FIRST.

   This file is the whole component: styles, markup and script in one place.
   It is designed to be pasted into a Liferay fragment's three fields (the
   <style> block, the markup, and the two <script> blocks in that order).

   There are exactly TWO changes you must make, and one you must not.

   ── CHANGE #1: the employee's name ──────────────────────────────────────
   Search this file for "CHANGE #1". "Timothy" is hardcoded and must come
   from Workday. Every employee gets Timothy's card until you do this.

   ── CHANGE #2: who sees it, and how often ───────────────────────────────
   Search this file for "CHANGE #2". Nothing gates this today: it shows to
   everyone on every page load, and refreshing brings back every popped
   balloon. You need to decide and implement:
     • whose birthday it is (from Workday), and
     • showing it once per person per year rather than on every visit.
   The hook for it is marked in the script below. window.bday.open() and
   window.bday.close() are there so you can drive it from your own gating
   rather than editing this file's internals.

   ── DO NOT: change the asset paths yet ──────────────────────────────────
   Images load from a local "Assets/" folder (Assets/Blue 1.png and friends).
   That is deliberate for now — keep it working locally first. When you move
   to Liferay proper, upload the Assets folder as fragment resources and
   repoint the two places paths are built:
     • srcFor() in the script below — the balloon frames
     • the src attributes in the markup above — the card and the pin
     • the cursor: url(...) rules in the styles above — the pin cursor
   ...to Liferay's [resources:filename] form. Note the balloon filenames
   contain SPACES ("Blue 1.png"), which srcFor() URL-encodes; renaming them
   to blue-1.png would make the Liferay paths simpler.

   ── Already handled, don't redo ─────────────────────────────────────────
   • Confetti is INLINED above. No npm, no CDN, no second file to serve.
   • Everything is prefixed bday_ so it cannot collide with the theme.
   • There is no background image: this sits ON TOP of the live intranet and
     blurs it. Don't add one back.
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
  "use strict";

  var root = document.getElementById("bday_root");
  if (!root) return;

  // Liferay can run fragment JS twice (page edit mode, SPA navigation).
  // Same node -> no-op. New node -> tear the old instance down first, or its
  // resize listener outlives it.
  if (root.getAttribute("data-bday-init") === "1") return;
  if (window.bday && window.bday.root !== root && typeof window.bday.destroy === "function") {

  }

  // The artwork ships 5 frames per colour (intact → cracked → split → shattered
  // → dispersed), but only the odd ones are used: 1 → 3 → 5. The even frames are
  // never referenced and never fetched — preloadFrames() walks this same list,
  // so adding a frame here is the only change needed to bring one back.
  var POP_FRAMES = [1, 3, 5];
  var LAST_FRAME = POP_FRAMES[POP_FRAMES.length - 1];
  var Z_LEVELS = 100;  // distinct stacking depths, so overlaps interleave

  // Every tunable value in one object so the preview harness can drive them
  // through window.bday.setConfig(). Defaults here are the shipped values —
  // the panel is a test tool, these are what the fragment renders with.
  var CONFIG = {
    // Balloon size as a multiple of the grid cell. This is the knob now — the
    // pixel size is derived from it and the viewport, so the field looks the
    // same proportionally on any screen. 1.78 reproduces the 320px balloons
    // that were signed off at 1440x900.
    balloonScale: 1.78,
    jitterRatio:  0.17, // offset from cell centre, as a fraction of the cell
    maxTilt:      12,   // degrees, applied as -maxTilt..+maxTilt
    frameMs:      30,   // gap between pop frames; a pop runs 4*frameMs = 120ms
    wavePxPerMs:  2,    // chain speed: delay = distance / this

    // Passed straight through to confetti.js. Names match its own options, so
    // its docs apply as written: count, size, velocity, fade, color, position.
    confettiCount:    40,
    confettiSize:     1,
    confettiVelocity: 200,
    confettiFade:     0,    // 0 = fall off screen, 1 = fade out in place

    // colour; "proximity" pops the clicked balloon plus its nearest neighbours,
    // up to a fixed count. Read at click time — no rebuild needed, so set these
    // via setPopMode()/config rather than setConfig().
    popMode:  "colour",
    popLevel: 1,           // index into POP_STEPS below: 1 => 9, 2 => 15, 3 => 25

    // "pin" | "crosshair" | "default" — change via setPointer(), not setConfig()
    pointer: "default"
  };

  // it. Passed to confetti.js as its `color` option.
  var CONFETTI_PALETTE = {

    Green:  ["#a7ee3d", "#67cc14", "#31a901"],
    Red:    ["#fde7f2", "#fc7fae", "#fc436f"],
    Sage:   ["#93eacd", "#49c094", "#2ba680"],
    Yellow: ["#fcdc4f", "#f9c427", "#e0a900"]
  };

  // wrong path after the Liferay repoint — calling it would throw and take the
  // rest of the component down with it. Balloons matter more than confetti.
  function burst(opts) {

  var reduceMq = window.matchMedia("(prefers-reduced-motion: reduce)");

  function srcFor(color, frame) {
    return "Assets/" + encodeURIComponent(color + " " + frame) + ".png";
  }

  // Count is an output, not an input. Pick the row count that keeps cells
  // closest to square for this viewport, then take the columns that land the
  // total inside [MIN_BALLOONS, MAX_BALLOONS]. Balloon size is then derived
  // from the resulting cell — see cellSizeFor() — so the balloon-to-cell ratio
  // stays constant across viewports instead of drifting the way a fixed
  // balloonSize did (1.78x the cell at 1440x900 but 2.19x at 1024x768).
  //
  // jitterRatio note: the grid exists only to keep the field evenly spread. At
  // 0.45 a balloon lands almost anywhere in its cell, which is what stops the
  // result reading as rows and columns. Much above 0.5 and cells start trading
  // places, which clumps and leaves holes.
  function grid(w, h) {
    // A zero measurement makes the sqrt NaN, and `row < NaN` is false, so the
    // fill loop silently produces nothing. Bail explicitly instead.
    if (!(w > 0) || !(h > 0)) return { cols: 0, rows: 0 };
    var target = (MIN_BALLOONS + MAX_BALLOONS) / 2;
    var rows = Math.max(1, Math.round(Math.sqrt(target * h / w)));
    var cols = Math.max(1, Math.round(target / rows));
    // Nudge columns until the product sits inside the band. Adjusting cols
    // rather than clamping the number keeps cols*rows equal to the balloons
    // actually built.
    while (cols * rows > MAX_BALLOONS && cols > 1) cols--;
    while (cols * rows < MIN_BALLOONS) cols++;

    // Large screens grow the grid rather than the balloons. This works because
    // balloonPxFor() derives size from the cell, so constraining the cell
    // constrains the size — no second mechanism needed.
    //
    // Each pass grows whichever axis has the larger cell. Two sequential loops
    // (width fully, then height) look equivalent but are not: at 3840x2160 the
    // width loop consumed the whole budget at 19 columns, leaving rows stuck at
    // 5, so cells were 202 wide but 432 tall — and size takes the max, giving
    // 769px balloons. Worse than doing nothing.
    var maxCell = MAX_BALLOON_PX / CONFIG.balloonScale;
    while (cols * rows < HARD_MAX_BALLOONS) {
      var cw = w / cols, ch = h / rows;
      if (cw <= maxCell && ch <= maxCell) break;          // both within the cap
      var growCols = cw >= ch;
      // If the preferred axis has no headroom, try the other before giving up.
      if (growCols && (cols + 1) * rows > HARD_MAX_BALLOONS) growCols = false;
      else if (!growCols && cols * (rows + 1) > HARD_MAX_BALLOONS) growCols = true;
      if (growCols) {
        if ((cols + 1) * rows > HARD_MAX_BALLOONS) break;
        cols++;
      } else {
        if (cols * (rows + 1) > HARD_MAX_BALLOONS) break;
        rows++;
      }
    }

    return { cols: cols, rows: rows };
  }

  // The balloon is sized off the larger cell dimension so neighbours still
  // overlap on unusual aspect ratios; min() would open gaps on a very wide
  // screen.
  function balloonPxFor(w, h, g) {
    return Math.round(CONFIG.balloonScale * Math.max(w / g.cols, h / g.rows));
  }

  // Deterministic value in [0,1) from a cell + salt. Seeded rather than
  // Math.random() so a resize only adds or removes balloons — the ones already
  // on screen keep their colour, tilt and jitter instead of reshuffling.
  function rand(col, row, salt) {
    var h = (col * 374761393 + row * 668265263 + salt * 1274126177) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  // Cells the user has already popped, keyed "col,row". Written at click time
  // rather than when the animation ends, so a resize mid-wave can't resurrect a
  // balloon that's already on its way out.
  var popped = Object.create(null);

  // Every pending timeout, so destroy() can cancel the tail of a wave instead of
  // letting it fire against detached nodes.
  var timers = [];
  function later(fn, ms) {
    var id = setTimeout(function () {
      var i = timers.indexOf(id);
      if (i > -1) timers.splice(i, 1);
      fn();
    }, ms);
    timers.push(id);
    return id;
  }
  function clearTimers() {
    for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
    timers.length = 0;
  }

  // Frames 2-5 are only fetched when a balloon pops. Without warming them the
  // first pop of each colour animates against an empty cache and stutters.
  //
  // Warmed straight away rather than through requestIdleCallback: idle callbacks
  // can be starved indefinitely on a busy or policy-throttled machine, and a
  // frame that hasn't arrived when a balloon pops animates against an empty
  // cache. Walks POP_FRAMES, so the unused even frames are never fetched.
  var preloaded = [];
  function preloadFrames() {
    for (var c = 0; c < COLORS.length; c++) {
      for (var i = 1; i < POP_FRAMES.length; i++) {   // frame 1 is already in the DOM

        preloaded.push(im);   // hold a reference so it isn't collected
      }
    }
  }

  // Counts the DOM each time rather than tracking a counter. The counter was
  // faster but had to be kept in sync from three places; at ~100 balloons this
  // costs nothing and cannot drift out of step with what's on screen.
  var liveBalloons = 0;   // kept only so fill() can report what it built

  function balloonsRemaining() {
    var all = layer.querySelectorAll(".bday_balloon");
    var n = 0;
    for (var i = 0; i < all.length; i++) {
      if (all[i].style.display !== "none") n++;
    }
    return n;
  }

  // Single place a balloon leaves the field, so the counter can't drift.
  function hideBalloon(img) {
    if (img.getAttribute("data-bday-gone") === "1") return;
    img.setAttribute("data-bday-gone", "1");
    img.style.display = "none";
  }

  // ── crosshair pointer ─────────────────────────────────────────────────
  // Only does work while CONFIG.pointer === "crosshair"; the pin and default
  // modes are pure CSS and need none of this running.
  //
  // The svg is 126x126 with its centre at 63,63 and 4px arms running from the
  // bounding box inward to the circle. So the rules stop 63px from the pointer:
  // exactly where the svg's own arms start, making one continuous line that the
  // circle interrupts. Change these together with the asset.
  var CROSSHAIR_PX = 126;
  var RULE_PX      = 4;
  var GAP          = CROSSHAIR_PX / 2;

  var ptrLayer = document.getElementById("bday_pointer");
  var crosshair = document.getElementById("bday_crosshair");
  var ruleL = document.getElementById("bday_ruleL");
  var ruleR = document.getElementById("bday_ruleR");
  var ruleT = document.getElementById("bday_ruleT");
  var ruleB = document.getElementById("bday_ruleB");

  var ptrX = 0, ptrY = 0, ptrRaf = null, ptrLive = false;

  function drawPointer() {
    ptrRaf = null;
    var w = layer.clientWidth, h = layer.clientHeight;
    var half = RULE_PX / 2;

    // Horizontal pair — both sit on the pointer's y, offset by half the rule so
    // the 4px band is centred on it (matching the svg's centred stroke).
    ruleL.style.width = Math.max(0, ptrX - GAP) + "px";
    ruleL.style.transform = "translate(0px," + (ptrY - half) + "px)";

    var rx = ptrX + GAP;
    ruleR.style.width = Math.max(0, w - rx) + "px";
    ruleR.style.transform = "translate(" + rx + "px," + (ptrY - half) + "px)";

    ruleT.style.height = Math.max(0, ptrY - GAP) + "px";
    ruleT.style.transform = "translate(" + (ptrX - half) + "px,0px)";

    ruleB.style.height = Math.max(0, h - by) + "px";
    ruleB.style.transform = "translate(" + (ptrX - half) + "px," + by + "px)";

      "translate(" + (ptrX - GAP) + "px," + (ptrY - GAP) + "px)";
  }

  // ── tracked pin ───────────────────────────────────────────────────────
  // Only in "default" mode, and only while the pointer is over a balloon.
  // The pin's tip sits at (0, PIN_HOTSPOT_Y) inside the image, so the wrapper
  // is placed that far above the pointer to put the tip on it.
  var PIN_HOTSPOT_Y = 47;   // tip's y inside the 48px art, from its alpha

  var pinEl = document.getElementById("bday_pin");
  var pinLive = false;

  function showPin(on) {
    if (on === pinLive) return;

    pinEl.hidden = !on;
    if (on) root.setAttribute("data-bday-pinlive", "1");

  function onPointerMove(e) {
    // Touch would light either pointer up at the last tap and strand it there.

      // e.target is the balloon itself: the layer is pointer-events:none and
      // the pin is too, so nothing else can intercept.
      var over = !!(e.target && e.target.classList &&
                    e.target.classList.contains("bday_balloon"));
      showPin(over);

        // crosshair, which writes five elements per move; this writes one
        // transform, and pointermove is already coalesced to about a frame.
        var lr = layer.getBoundingClientRect();
        pinEl.style.transform = "translate(" + (e.clientX - lr.left) + "px," +

      return;
    }

    if (CONFIG.pointer !== "crosshair") return;
    var r = layer.getBoundingClientRect();
    ptrX = e.clientX - r.left;
    ptrY = e.clientY - r.top;

      root.setAttribute("data-bday-cursor", "1");

    showPin(false);
  }

  // The count band. Not in CONFIG: these bound the design rather than tune it,
  // and a slider that could take the field to 3 balloons is not a useful knob.
  var MIN_BALLOONS = 40;
  var MAX_BALLOONS = 50;

  // Above this pixel size the grid grows instead of the balloons. Without it
  // count stayed at ~45 on every screen and the field was simply zoomed: 320px
  // balloons at 1440x900 became 513px at 2560x1440, nearly three-quarters the
  // width of the message card and only 1.56x down from the 800px source.
  var MAX_BALLOON_PX = 360;

  // pop behaviour is read at click time, and rebuilding would clear the popped
  // set just to change what the next click does.
  function setPopMode(mode) {
    if (POP_MODES.indexOf(mode) === -1) return CONFIG.popMode;

  }

  // Cursor changes take effect immediately — unlike setConfig(), which rebuilds
  // the balloon field. Rebuilding to swap a cursor would clear the popped set
  // and wipe whatever the user was mid-way through.
  function setPointer(mode) {
    if (POINTER_MODES.indexOf(mode) === -1) return CONFIG.pointer;
    CONFIG.pointer = mode;
    root.setAttribute("data-bday-pointer", mode);
    if (mode !== "crosshair") {
      // Leaving crosshair mode: park the layer and hand the cursor back.
      ptrLive = false;
      ptrLayer.hidden = true;
      root.removeAttribute("data-bday-cursor");
      if (ptrRaf !== null) { cancelAnimationFrame(ptrRaf); ptrRaf = null; }
    }

    if (mode !== "default") showPin(false);
    return mode;

  // Runs one balloon through POP_FRAMES (1 → 3 → 5), then takes it out of the
  // layout. Frame timing stays keyed to the frame number, not to its index, so
  // skipping the even frames holds each remaining one twice as long rather than
  // making the whole pop shorter.
  function popOne(img) {
    if (reduceMq.matches) {
      hideBalloon(img);
      return;

    var color = img.getAttribute("data-bday-color");
    for (var i = 1; i < POP_FRAMES.length; i++) {
      (function (frame) {
        later(function () {
          if (!img.isConnected) return;
          img.src = srcFor(color, frame);
          // Frame 3 is the shatter — nothing should escape an intact balloon.
          // confetti.js positions in viewport coordinates, which is what
          // getBoundingClientRect gives us.
          if (frame === 3) {
            var r = img.getBoundingClientRect();
            burst({
              position: { x: r.left + r.width / 2, y: r.top + r.height / 2 },
              count: CONFIG.confettiCount,
              size: CONFIG.confettiSize,
              velocity: CONFIG.confettiVelocity,
              fade: !!CONFIG.confettiFade,
              color: CONFETTI_PALETTE[color] || CONFETTI_PALETTE.Blue

      if (img.isConnected) hideBalloon(img);

  // Which balloons a click takes out, already measured and ordered by distance
  // from the click. One pass over the field: every getBoundingClientRect() in a
  // pop happens here, so popWave() below writes without ever re-reading layout.
  //
  // Returns [{el, dist}], nearest first. Both pop modes come through here, so
  // either way the pop still travels outward as one expanding front.
  function targetsFor(origin) {
    var o = origin.getBoundingClientRect();
    var ox = o.left + o.width / 2;
    var oy = o.top + o.height / 2;
    var wantColor = origin.getAttribute("data-bday-color");
    var proximity = CONFIG.popMode === "proximity";

    var all = layer.querySelectorAll(".bday_balloon");
    var live = [];
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      // Already on its way out, or already gone. Skipping these is what makes
      // the proximity count mean "15 balloons you can still see" on a field
      // that has been clicked a few times already.
      if (el.getAttribute("data-bday-popping") === "1") continue;
      if (el.getAttribute("data-bday-gone") === "1") continue;
      if (!proximity && el.getAttribute("data-bday-color") !== wantColor) continue;
      var r = el.getBoundingClientRect();
      // A display:none balloon measures 0x0; without this it would look like a
      // balloon sitting at the viewport's top-left and win on distance.
      if (!(r.width > 0)) continue;
      var dx = r.left + r.width / 2 - ox;
      var dy = r.top + r.height / 2 - oy;
      live.push({ el: el, dist: Math.sqrt(dx * dx + dy * dy) });
    }

    if (!proximity) return live;

    // Nearest N, not a ring. The counts the design wants — 9, 15, 25 — are not
    // all square numbers, and 15 has no symmetric shape on a grid at all: rings
    // give 9/25/49 and diamonds give 13/21, so a shape-based rule simply cannot
    // express it. Picking a count instead also behaves better at the field's
    // edges, where a ring gets clipped into a lopsided wedge while a count just
    // reaches further in to fill its quota.
    //
    // Distance is real pixels rather than grid cells. Cells were the right call
    // when this was a ring — a pixel radius caught lopsided sets near the edges
    // — but for a fixed count the jitter is an asset: it decides the ties that
    // an integer cell distance would otherwise have to break arbitrarily, which
    // is exactly where an asymmetric count like 15 would show as a blob.
    live.sort(function (a, b) { return a.dist - b.dist; });
    return live.slice(0, popCount());
  }

  function popWave(origin) {
    // All reads happened in targetsFor(). data-bday-popping drives a CSS rule,
    // so writing it invalidates style — interleaving that with a rect read
    // forced a fresh layout on every iteration.
    var targets = targetsFor(origin);
    var speed = CONFIG.wavePxPerMs;
    var instant = reduceMq.matches;

    for (var j = 0; j < targets.length; j++) {
      var t = targets[j];
      t.el.setAttribute("data-bday-popping", "1");
      popped[t.el.getAttribute("data-bday-cell")] = true;

        later(function () { popOne(target); }, delay);
      })(t.el, instant ? 0 : t.dist / speed);

    var img = e.target;
    if (!img || !img.classList || !img.classList.contains("bday_balloon")) return;
    popWave(img);

  // ── dismissal ─────────────────────────────────────────────────────────

  // down would mean rebuilding ~45 nodes to do so. destroy() is still the real
  // teardown. Timers are cancelled either way, or the tail of a wave keeps
  // firing against a takeover nobody can see.
  //

  // anything still in flight paints on over the closed takeover for a moment.

  var closeBtn = document.getElementById("bday_close");
  var lastFocus = null;

  function closeTakeover() {
    if (root.hidden) return;
    clearTimers();
    showPin(false);
    root.hidden = true;

    // button with no idea where they are in the page.
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (err) {} }
  }

  function openTakeover() {
    if (!root.hidden) return;
    root.hidden = false;
    focusClose();
  }

  // A full-screen overlay that traps nothing is a keyboard dead end, so focus
  // moves to the one control that gets you out. Guarded: if the fragment is
  // mounted hidden this would scroll a hidden element into view.
  function focusClose() {
    if (root.hidden || !closeBtn) return;
    lastFocus = document.activeElement;
    try { closeBtn.focus({ preventScroll: true }); } catch (err) {}
  }

  function onKeydown(e) {
    if (e.key === "Escape" || e.key === "Esc") closeTakeover();
  }

  function fill() {
    var w = layer.clientWidth;
    var h = layer.clientHeight;

    var g = grid(w, h);
    var cols = g.cols, rows = g.rows;
    var cellW = w / cols, cellH = h / rows;

    var frag = document.createDocumentFragment();
    var made = 0;
    // Hoisted: these were read from CONFIG once per cell, up to 100 times.
    var jitter = CONFIG.jitterRatio, maxTilt = CONFIG.maxTilt;
    var nColors = COLORS.length;

    for (var row = 0; row < rows; row++) {
      for (var col = 0; col < cols; col++) {
        // A popped cell stays popped. Without this a resize rebuilds the field
        // and every balloon the user already popped comes back.
        if (popped[col + "," + row]) continue;

        // Brick layout — distributes more evenly than a square grid at the same
        // count. Rows shift a quarter-cell in alternating directions rather than
        // every other row shifting right, which would bleed the field off the
        // right edge while leaving the left flush.
        var stagger = (row % 2 ? 1 : -1) * (cellW / 4);

        // +0.5 puts the balloon at the cell's centre, so the field is inset
        // from the edges rather than half-clipped against them.
        var x = (col + 0.5) * cellW + stagger +
                (rand(col, row, 1) * 2 - 1) * cellW * jitter;
        var y = (row + 0.5) * cellH +
                (rand(col, row, 2) * 2 - 1) * cellH * jitter;

        var color = COLORS[Math.floor(rand(col, row, 3) * nColors)];
        var tilt = (rand(col, row, 4) * 2 - 1) * maxTilt;

        // Random depth rather than DOM order, so the overlaps don't all fall
        // the same way down-and-right and give the grid away.
        var z = 1 + Math.floor(rand(col, row, 5) * Z_LEVELS);

        var img = document.createElement("img");
        img.className = "bday_balloon";
        img.src = srcFor(color, 1);
        img.alt = "";
        img.setAttribute("aria-hidden", "true");
        img.setAttribute("data-bday-color", color);
        img.setAttribute("data-bday-cell", col + "," + row);
        img.style.left = x.toFixed(1) + "px";
        img.style.top = y.toFixed(1) + "px";
        img.style.zIndex = z;
        // Only the tilt is set inline; the full transform is composed in CSS so
        // the :hover scale can apply on top of it.
        img.style.setProperty("--bday-tilt", tilt.toFixed(2) + "deg");

        frag.appendChild(img);
        made++;
      }
    }

    layer.textContent = "";
    layer.appendChild(frag);
    liveBalloons = made;
  }

  var lastCols = -1, lastRows = -1, lastW = -1, lastH = -1;

  function applyResize() {
    resizeRaf = null;
    var w = layer.clientWidth, h = layer.clientHeight;   // read once, not 4x
    // Measured zero: the fragment is hidden, or laid out later than init. Do
    // nothing and leave lastW/lastH untouched, so the ResizeObserver below
    // still sees a change when real dimensions arrive.
    if (!(w > 0) || !(h > 0)) return;
    var g = grid(w, h);
    // Cell size tracks the viewport continuously, so refill whenever the
    // dimensions change at all — not only when the row/column count does.
    if (g.cols === lastCols && g.rows === lastRows && w === lastW && h === lastH) return;
    lastCols = g.cols;
    lastRows = g.rows;
    lastW = w;
    lastH = h;
    // Size is derived from the cell, so it has to be recomputed here on every
    // resize — not once at init. Setting it before fill() means the balloons
    // are laid out against the size they will actually render at.
    applySize(w, h, g);
    // Rule lengths are measured off the viewport, so they go stale on a resize
    // that doesn't move the mouse.
    if (ptrLive) drawPointer();
    fill();
  }

  // Applied directly. rAF-coalescing was tried here to avoid rebuilding ~100
  // nodes per resize event, but it means nothing lays out until the browser
  // grants a frame — and a background tab never does, so a resize while hidden
  // silently never applies.
  var resizeRaf = null;
  function onResize() { applyResize(); }

  // Derived, not configured. Called from applyResize() with the dimensions it
  // already measured, so this never re-reads layout.
  var lastBalloonPx = 0;
  function applySize(w, h, g) {
    lastBalloonPx = balloonPxFor(w, h, g);
    root.style.setProperty("--bday-balloon-size", lastBalloonPx + "px");
  }

  // Rebuild from scratch. Tuning is a deliberate act, so it also clears the
  // popped set — cell keys stop meaning the same thing once the grid changes,
  // and a half-popped field would make the new settings hard to judge.
  function rebuild() {
    clearTimers();
    popped = Object.create(null);
    // No applySize() here — applyResize() derives and sets it, and calling it
    // without the measured dimensions would write NaN.
    lastCols = lastRows = lastW = lastH = -1;
    applyResize();   // synchronous: callers expect the field to exist on return
  }

  applyResize();
  window.addEventListener("resize", onResize);

  // A window resize event is not enough. The fragment can be mounted inside a
  // hidden container (Liferay tab, accordion) or simply lay out after this
  // script runs — in both cases it measures 0 at init and no resize event ever
  // follows, so it would stay empty forever. Watching the element itself is the
  // playbook's "measure on open, not on init".
  var ro = null;
  if (window.ResizeObserver) {
    ro = new ResizeObserver(onResize);
    ro.observe(root);
  }
  layer.addEventListener("click", onClick);
  root.addEventListener("pointermove", onPointerMove);
  root.addEventListener("pointerout", onPointerOut);
  if (closeBtn) closeBtn.addEventListener("click", closeTakeover);
  // On document, not root: once focus has left the takeover Esc must still work.
  document.addEventListener("keydown", onKeydown);
  setPointer(CONFIG.pointer);
  preloadFrames();
  focusClose();

  /* ════════════════════════════════════════════════════════════════════════
     DEVELOPERS — CHANGE #2 OF 2: GATING. THIS IS THE HOOK.

     Right now the takeover simply appears, for everyone, on every page load.
     Refreshing the page also brings back every balloon the user popped.
     That is intentional for the prototype and is NOT acceptable in production.

     Add your logic here. You need two things, both of which come from data
     this component does not have and should not fetch itself:

       1. IS IT THIS PERSON'S BIRTHDAY?  From Workday, via Liferay user
          context. If not, close it immediately:

              if (!isBirthdayToday) { window.bday.close(); }

       2. HAVE THEY ALREADY SEEN IT THIS YEAR?  Show it once per person per
          year, not on every visit. Persist that somewhere durable — a Liferay
          user preference / expando, or your own service. localStorage alone
          is not enough: it is per-browser, so the user sees it again on a
          different machine, and it is wiped by a profile reset.

              if (alreadySeenThisYear) { window.bday.close(); }
              else { markSeen(); }

     Prefer calling window.bday.close() / window.bday.open() over editing this
     file's internals — they are the supported way in and out, and close()
     cancels the animation timers for you.

     Note the takeover renders BEFORE this runs, so a gated-out user may see a
     single frame of balloons. If that matters, start the root hidden in the
     markup (add the `hidden` attribute to .bday_root) and call
     window.bday.open() once you have decided they should see it.
     ════════════════════════════════════════════════════════════════════════ */

  /* ════════════════════════════════════════════════════════════════════════
     KNOWN RISK — TEST THIS ON THE REAL THEME BEFORE ANYTHING ELSE.

     .bday_root is `position: fixed; inset: 0`, which normally means "cover the
     browser window". But if ANY ancestor element has a `transform`, `filter`
     or `perspective` on it, `fixed` silently switches to covering that
     ancestor instead of the window. Intranet themes very commonly have one.

     Symptom: the takeover appears boxed inside part of the page instead of
     over all of it, and the blur only covers that box.

     Fix, if it happens: move the root to be a direct child of <body> on init,
     which puts it outside any such ancestor. Roughly:

         if (root.parentNode !== document.body) document.body.appendChild(root);

     It is left out here because it is unnecessary if the theme is clean, and
     moving a fragment's own DOM is the kind of thing that should be a
     deliberate decision rather than a surprise. It is ~1 line if you need it.
     ════════════════════════════════════════════════════════════════════════ */

  window.bday = {
    root: root,
    config: CONFIG,
    // Merge a patch of CONFIG values and rebuild. Used by preview.html's
    // tuning panel; also lets an integrator retune without editing the script.
    setConfig: function (patch) {
      for (var k in patch) {
        if (Object.prototype.hasOwnProperty.call(patch, k) &&
            Object.prototype.hasOwnProperty.call(CONFIG, k)) {
          CONFIG[k] = patch[k];
        }
      }
      rebuild();
      return CONFIG;
    },
    reset: rebuild,
    close: closeTakeover,   // what the × and Esc call; hides, keeps the field
    open: openTakeover,     // counterpart, for a host that gates when it shows
    confetti: burst,   // guarded wrapper, not window.confetti directly
    balloonsRemaining: balloonsRemaining,
    popModes: POP_MODES,
    setPopMode: setPopMode,
    popSteps: POP_STEPS,   // the proximity counts, indexed by config.popLevel
    pointerModes: POINTER_MODES,
    setPointer: setPointer,

    // Quick state dump for debugging on a machine you can't attach to.
    diagnose: function () {
      var report = {
        // Suppresses the pop frame sequence entirely — commonly enabled by
        // policy on managed Windows machines.
        prefersReducedMotion: reduceMq.matches,
        // false means the vendored script didn't load — check the path after
        // the Liferay resource repoint.
        confettiLibLoaded: typeof window.confetti === "function",
        balloonsInDom: layer.querySelectorAll(".bday_balloon").length,
        balloonsRemaining: balloonsRemaining(),
        layerSize: layer.clientWidth + "x" + layer.clientHeight,
        // Derived from the viewport, not configured — see grid()/balloonPxFor.
        balloonPx: lastBalloonPx,
        balloonScale: CONFIG.balloonScale,
        countBand: MIN_BALLOONS + "-" + MAX_BALLOONS + " (grows to " +
                   HARD_MAX_BALLOONS + " above " + MAX_BALLOON_PX + "px)",
        popMode: CONFIG.popMode,
        popLevel: CONFIG.popLevel,
        popCount: popCount() + " of " + POP_STEPS.join("/"),
        devicePixelRatio: window.devicePixelRatio || 1,
        pointerMode: CONFIG.pointer,
        userAgent: navigator.userAgent
      };
      try { console.log(report); } catch (e) {}
      return report;
    },
    destroy: function () {
      window.removeEventListener("resize", onResize);
      if (ro) { ro.disconnect(); ro = null; }
      layer.removeEventListener("click", onClick);
      root.removeEventListener("pointermove", onPointerMove);
      root.removeEventListener("pointerout", onPointerOut);
      if (closeBtn) closeBtn.removeEventListener("click", closeTakeover);
      document.removeEventListener("keydown", onKeydown);
      if (ptrRaf !== null) cancelAnimationFrame(ptrRaf);
      ptrRaf = null;
      if (resizeRaf !== null) cancelAnimationFrame(resizeRaf);
      resizeRaf = null;
      clearTimers();
      if (root.parentNode) root.parentNode.removeChild(root);
      window.bday = null;
    }
  };
})();
</script>
