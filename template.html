<style>
/* Fixed + inset:0 so the takeover covers the viewport no matter where in the
   host page's DOM the fragment gets mounted. */
.bday_root {
  position: fixed;
  inset: 0;
  z-index: 9999;
  overflow: hidden;
}

/* The host intranet styles bare `img` (border, margin). Without this reset those
   land on our background and knock it out of alignment — caught in preview.html. */
.bday_root img { display: block; border: 0; margin: 0; }

.bday_bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.bday_overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(23, 39, 51, 0.85) 0%,
    rgba(69, 118, 153, 0.85) 100%
  );
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
}

/* The message card. Sits above the overlay and below the balloons, so it's
   uncovered as they pop rather than needing any reveal logic of its own.
   No z-index on purpose: it and .bday_overlay are both auto, so DOM order puts
   it above the overlay, while the balloons' inline z-index (1..Z_LEVELS) keeps
   them in front. Giving this a z-index would break that. */
.bday_card {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  /* Fixed 702px per spec. The min() only guards windows narrower than the
     supported 1024 floor — at 1024 the card is still a full 702px. */
  width: min(702px, calc(100vw - 80px));
  /* Never intercept a balloon click — the balloons sit in front of this. */
  pointer-events: none;
}

.bday_card-art { display: block; width: 100%; height: auto; }

/* Sits in the card's blank upper band, above the printed balloons. */
.bday_card-body {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  padding: 48px 48px 0;
  /* Public Sans is expected from the Liferay theme — this fragment must not
     pull a webfont itself (a strict CSP would block the CDN). preview.html
     loads it separately so the harness renders what production will. */
  font-family: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: #172733;
}

.bday_card-title {
  font-size: 32px;
  font-weight: 600;   /* semibold */
  line-height: 120%;
  letter-spacing: -0.1px;
}

/* Descendant-scoped so it outranks the `.bday_root p` reset below, which is
   (0,1,1) and would otherwise flatten this margin back to zero. */
.bday_root .bday_card-text {
  /* Gap between heading and body isn't in the spec — 12px is assumed. */
  margin-top: 12px;
  font-size: 20px;
  font-weight: 400;
  line-height: 150%;
  letter-spacing: -0.1px;
}

/* Host defence: the intranet styles bare h2/p, and our harness proves it by
   setting `p { margin: 0 0 18px }`. Without this the copy inherits it. */
.bday_root h2, .bday_root p { margin: 0; }

/* ── pointer modes ────────────────────────────────────────────────────
   Driven by data-bday-pointer on the root, set via window.bday.setPointer().
   Balloons use cursor:inherit, so setting it here reaches them too.

   "pin"       native cursor, hotspot 3,3 at the needle tip. No rAF, no lag.
   "crosshair" reticle + full-viewport rules, tracked in JS below. Reads as a
               targeting scope, which is a questionable register for a birthday
               — kept switchable so the difference can be judged side by side.
   "default"   the host page's own cursor, untouched. */
.bday_root[data-bday-pointer="pin"] { cursor: url('Assets/pin.svg') 3 3, auto; }
/* "default" leaves the arrow on the backdrop and shows the click cursor on the
   balloons — the conventional signal that a thing is clickable. */
.bday_root[data-bday-pointer="default"] { cursor: default; }
.bday_root[data-bday-pointer="default"] .bday_balloon { cursor: pointer; }

/* The system cursor is hidden only once the crosshair is actually tracking
   (data-bday-cursor, set on first pointermove), so a script failure can't leave
   the user with no cursor. Fine pointers only: on touch there's nothing to
   replace. */
@media (hover: hover) and (pointer: fine) {
  .bday_root[data-bday-pointer="crosshair"][data-bday-cursor="1"] { cursor: none; }
}

.bday_pointer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 300;
}
.bday_pointer[hidden] { display: none; }

.bday_crosshair {
  position: absolute;
  left: 0; top: 0;
  width: 126px;   /* must match CROSSHAIR_PX and the svg's viewBox */
  height: 126px;
}

/* The four segments run from the crosshair out to the viewport edges. They stop
   at the svg's bounding box, so they meet its arms without overlapping the
   circle inside it. The colour must match the stroke in Assets/crosshair.svg —
   the rules and the arms read as one continuous line, so a mismatch shows as a
   seam at the join. */
.bday_rule { position: absolute; left: 0; top: 0; background: #FF7E65; }
.bday_rule-h { height: 4px; }
.bday_rule-v { width: 4px; }

/* Decorative layer — never intercepts clicks from whatever lands on top later. */
.bday_balloons {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

/* left/top place the centre; the transform does the centring so rotation
   pivots on the balloon's middle rather than its top-left corner. */
.bday_balloon {
  position: absolute;
  /* Driven by a custom property so size can change without a refill. */
  width: var(--bday-balloon-size, 160px);
  height: var(--bday-balloon-size, 160px);
  /* The layer is pointer-events:none so gaps stay click-through; the balloons
     opt back in.
     No clip-path here. An inscribed circle() looks like it would only remove the
     transparent corners, but the shapes differ per colour — Yellow is a star and
     Red is broader than it is tall — so it sliced the tips off: 6.1% of Red's
     opaque pixels, 2.9% of Blue's, 2.2% of Yellow's. Any circle large enough to
     spare them covers the whole box anyway. The cost is that a click on a
     transparent corner still hits this element; see BACKLOG for alpha hit-testing. */
  pointer-events: auto;
  /* Inherit the active pointer mode. In "pin" the pin is itself the affordance,
     so a hand on hover would undercut it; "default" overrides this below. */
  cursor: inherit;

  /* Composed here rather than inline: an inline transform would outrank the
     :hover rule below, and hardcoding it would lose each balloon's own tilt.
     The script sets --bday-tilt per balloon; --bday-scale is the hover hook. */
  transform: translate(-50%, -50%)
             rotate(var(--bday-tilt, 0deg))
             scale(var(--bday-scale, 1));
  /* Default duration is the hover-*out*; :hover overrides it for the way in. */
  transition: transform 50ms ease-out;
}

/* Guarded so a touch device can't get stuck in the hovered state after a tap. */
@media (hover: hover) and (pointer: fine) {
  .bday_balloon:hover { --bday-scale: 1.1; transition-duration: 100ms; }
}

/* Keep the affordance, drop the movement. */
@media (prefers-reduced-motion: reduce) {
  .bday_balloon, .bday_balloon:hover { transition-duration: 0ms; }
}

/* Once it's popping it must stop being a click target, or a second click
   restarts the sequence mid-way. pointer-events:none also drops any hover
   scale, so a popping balloon animates its frames at true size. */
.bday_balloon[data-bday-popping="1"] { pointer-events: none; }
</style>

<div class="bday_root" id="bday_root">
  <!-- Placeholder dashboard, not a real screenshot — see Assets/background.svg.
       The real intranet capture is kept out of the repo; whether this layer
       should exist at all is an open question in BACKLOG.md §1. -->
  <img class="bday_bg" src="Assets/background.svg" alt="" aria-hidden="true" />
  <div class="bday_overlay"></div>
  <!-- The final message, revealed as the balloons in front of it are popped.
       The artwork is decorative; the message itself is live text so it stays
       readable, translatable and screen-reader accessible. -->
  <div class="bday_card" id="bday_card">
    <img class="bday_card-art" src="Assets/card.png" alt="" aria-hidden="true" />
    <div class="bday_card-body">
      <!-- h2 not h1: this is a fragment inside a host page that has its own h1.
           PLACEHOLDER NAME — "Timothy" must come from Liferay user context. -->
      <h2 class="bday_card-title">Happy birthday Timothy!</h2>
      <p class="bday_card-text">Sending you best wishes for your special day and the years ahead. Don't forget to take your birthday leave this month!</p>
    </div>
  </div>
  <div class="bday_balloons" id="bday_balloons" aria-hidden="true"></div>

  <!-- Only populated in crosshair mode; hidden otherwise. -->
  <div class="bday_pointer" id="bday_pointer" aria-hidden="true" hidden>
    <span class="bday_rule bday_rule-h" id="bday_ruleL"></span>
    <span class="bday_rule bday_rule-h" id="bday_ruleR"></span>
    <span class="bday_rule bday_rule-v" id="bday_ruleT"></span>
    <span class="bday_rule bday_rule-v" id="bday_ruleB"></span>
    <img class="bday_crosshair" id="bday_crosshair" src="Assets/crosshair.svg" alt="" />
  </div>
</div>

<script>
(function () {
  "use strict";

  var root = document.getElementById("bday_root");
  if (!root) return;

  // Liferay can run fragment JS twice (page edit mode, SPA navigation).
  // Same node -> no-op. New node -> tear the old instance down first, or its
  // resize listener outlives it.
  if (root.getAttribute("data-bday-init") === "1") return;
  if (window.bday && window.bday.root !== root && typeof window.bday.destroy === "function") {
    try { window.bday.destroy(); } catch (err) { /* ignore */ }
  }
  root.setAttribute("data-bday-init", "1");

  var layer = document.getElementById("bday_balloons");

  var COLORS = ["Blue", "Green", "Red", "Sage", "Yellow"];
  var FRAMES   = 5;    // "<Colour> 1".."<Colour> 5" — intact to dispersed
  var Z_LEVELS = 100;  // distinct stacking depths, so overlaps interleave

  // Every tunable value in one object so the preview harness can drive them
  // through window.bday.setConfig(). Defaults here are the shipped values —
  // the panel is a test tool, these are what the fragment renders with.
  var CONFIG = {
    maxBalloons:  100,  // hard ceiling — denser than this reads as noise
    balloonSize:  208,  // px
    jitterRatio:  0.17, // offset from cell centre, as a fraction of the cell
    maxTilt:      12,   // degrees, applied as -maxTilt..+maxTilt
    frameMs:      30,   // gap between pop frames; a pop runs 4*frameMs = 120ms
    wavePxPerMs:  2,    // chain speed: delay = distance / this

    // "pin" | "crosshair" | "default" — change via setPointer(), not setConfig()
    pointer: "default"
  };

  var reduceMq = window.matchMedia("(prefers-reduced-motion: reduce)");

  function srcFor(color, frame) {
    return "Assets/" + encodeURIComponent(color + " " + frame) + ".png";
  }

  // Derive the grid from the cap rather than from a fixed spacing: pick the
  // row count that keeps cells closest to square for this viewport, then take
  // as many columns as the budget allows. Guarantees cols*rows <= maxBalloons
  // at any width instead of scaling with the viewport.
  //
  // jitterRatio note: the grid exists only to keep the field evenly spread. At
  // 0.45 a balloon lands almost anywhere in its cell, which is what stops the
  // result reading as rows and columns. Much above 0.5 and cells start trading
  // places, which clumps and leaves holes.
  function grid(w, h) {
    // A zero measurement makes maxBalloons*h/w NaN, and `row < NaN` is false, so
    // the fill loop silently produces nothing. Bail explicitly instead.
    if (!(w > 0) || !(h > 0)) return { cols: 0, rows: 0 };
    var rows = Math.max(1, Math.round(Math.sqrt(CONFIG.maxBalloons * h / w)));
    var cols = Math.max(1, Math.floor(CONFIG.maxBalloons / rows));
    return { cols: cols, rows: rows };
  }

  // Deterministic value in [0,1) from a cell + salt. Seeded rather than
  // Math.random() so a resize only adds or removes balloons — the ones already
  // on screen keep their colour, tilt and jitter instead of reshuffling.
  function rand(col, row, salt) {
    var h = (col * 374761393 + row * 668265263 + salt * 1274126177) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  // Cells the user has already popped, keyed "col,row". Written at click time
  // rather than when the animation ends, so a resize mid-wave can't resurrect a
  // balloon that's already on its way out.
  var popped = Object.create(null);

  // Every pending timeout, so destroy() can cancel the tail of a wave instead of
  // letting it fire against detached nodes.
  var timers = [];
  function later(fn, ms) {
    var id = setTimeout(function () {
      var i = timers.indexOf(id);
      if (i > -1) timers.splice(i, 1);
      fn();
    }, ms);
    timers.push(id);
    return id;
  }
  function clearTimers() {
    for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
    timers.length = 0;
  }

  // Frames 2-5 are only fetched when a balloon pops. Without warming them the
  // first pop of each colour animates against an empty cache and stutters.
  //
  // Deferred to idle: this is ~5MB across 20 files, and firing it during load
  // put it in direct contention with the 5 frame-1 images the user can actually
  // see. Nothing can pop until the field is rendered and clicked, so there is
  // no reason for it to compete.
  // Loaded straight away, all 20. Draining this through requestIdleCallback was
  // tried to keep it off the critical path, but idle callbacks can be starved
  // indefinitely on a busy or policy-throttled machine — and if a frame hasn't
  // arrived when a balloon pops, the pop animates against an empty cache.
  var preloaded = [];
  function preloadFrames() {
    for (var c = 0; c < COLORS.length; c++) {
      for (var f = 2; f <= FRAMES; f++) {
        var im = new Image();
        im.src = srcFor(COLORS[c], f);
        preloaded.push(im);   // hold a reference so it isn't collected
      }
    }
  }

  // Counts the DOM each time rather than tracking a counter. The counter was
  // faster but had to be kept in sync from three places; at ~100 balloons this
  // costs nothing and cannot drift out of step with what's on screen.
  var liveBalloons = 0;   // kept only so fill() can report what it built

  function balloonsRemaining() {
    var all = layer.querySelectorAll(".bday_balloon");
    var n = 0;
    for (var i = 0; i < all.length; i++) {
      if (all[i].style.display !== "none") n++;
    }
    return n;
  }

  // Single place a balloon leaves the field, so the counter can't drift.
  function hideBalloon(img) {
    if (img.getAttribute("data-bday-gone") === "1") return;
    img.setAttribute("data-bday-gone", "1");
    img.style.display = "none";
  }

  // ── crosshair pointer ─────────────────────────────────────────────────
  // Only does work while CONFIG.pointer === "crosshair"; the pin and default
  // modes are pure CSS and need none of this running.
  //
  // The svg is 126x126 with its centre at 63,63 and 4px arms running from the
  // bounding box inward to the circle. So the rules stop 63px from the pointer:
  // exactly where the svg's own arms start, making one continuous line that the
  // circle interrupts. Change these together with the asset.
  var CROSSHAIR_PX = 126;
  var RULE_PX      = 4;
  var GAP          = CROSSHAIR_PX / 2;

  var ptrLayer = document.getElementById("bday_pointer");
  var crosshair = document.getElementById("bday_crosshair");
  var ruleL = document.getElementById("bday_ruleL");
  var ruleR = document.getElementById("bday_ruleR");
  var ruleT = document.getElementById("bday_ruleT");
  var ruleB = document.getElementById("bday_ruleB");

  var ptrX = 0, ptrY = 0, ptrRaf = null, ptrLive = false;

  function drawPointer() {
    ptrRaf = null;
    var w = layer.clientWidth, h = layer.clientHeight;
    var half = RULE_PX / 2;

    // Horizontal pair — both sit on the pointer's y, offset by half the rule so
    // the 4px band is centred on it (matching the svg's centred stroke).
    ruleL.style.width = Math.max(0, ptrX - GAP) + "px";
    ruleL.style.transform = "translate(0px," + (ptrY - half) + "px)";

    var rx = ptrX + GAP;
    ruleR.style.width = Math.max(0, w - rx) + "px";
    ruleR.style.transform = "translate(" + rx + "px," + (ptrY - half) + "px)";

    ruleT.style.height = Math.max(0, ptrY - GAP) + "px";
    ruleT.style.transform = "translate(" + (ptrX - half) + "px,0px)";

    var by = ptrY + GAP;
    ruleB.style.height = Math.max(0, h - by) + "px";
    ruleB.style.transform = "translate(" + (ptrX - half) + "px," + by + "px)";

    crosshair.style.transform =
      "translate(" + (ptrX - GAP) + "px," + (ptrY - GAP) + "px)";
  }

  function onPointerMove(e) {
    if (CONFIG.pointer !== "crosshair") return;
    // Touch would light the crosshair up at the last tap and strand it there.
    if (e.pointerType === "touch") return;
    var r = layer.getBoundingClientRect();
    ptrX = e.clientX - r.left;
    ptrY = e.clientY - r.top;
    if (!ptrLive) {
      ptrLive = true;
      ptrLayer.hidden = false;
      root.setAttribute("data-bday-cursor", "1");
    }
    // Batch to a frame: a high-polling-rate mouse fires several moves per frame.
    if (ptrRaf === null) ptrRaf = requestAnimationFrame(drawPointer);
  }

  function onPointerOut(e) {
    // relatedTarget null == left the window rather than moved to a child.
    if (e.relatedTarget) return;
    ptrLive = false;
    ptrLayer.hidden = true;
    root.removeAttribute("data-bday-cursor");
  }

  var POINTER_MODES = ["pin", "crosshair", "default"];

  // Cursor changes take effect immediately — unlike setConfig(), which rebuilds
  // the balloon field. Rebuilding to swap a cursor would clear the popped set
  // and wipe whatever the user was mid-way through.
  function setPointer(mode) {
    if (POINTER_MODES.indexOf(mode) === -1) return CONFIG.pointer;
    CONFIG.pointer = mode;
    root.setAttribute("data-bday-pointer", mode);
    if (mode !== "crosshair") {
      // Leaving crosshair mode: park the layer and hand the cursor back.
      ptrLive = false;
      ptrLayer.hidden = true;
      root.removeAttribute("data-bday-cursor");
      if (ptrRaf !== null) { cancelAnimationFrame(ptrRaf); ptrRaf = null; }
    }
    return mode;
  }

  // Runs one balloon through frames 2..5, then takes it out of the layout.
  function popOne(img) {
    if (reduceMq.matches) {
      hideBalloon(img);
      return;
    }
    var color = img.getAttribute("data-bday-color");
    for (var f = 2; f <= FRAMES; f++) {
      (function (frame) {
        later(function () {
          if (img.isConnected) img.src = srcFor(color, frame);
        }, (frame - 1) * CONFIG.frameMs);
      })(f);
    }
    later(function () {
      if (img.isConnected) hideBalloon(img);
    }, FRAMES * CONFIG.frameMs);
  }

  // Pops every balloon sharing the clicked one's colour, scheduled by distance
  // so the pop travels outward as a wave. Delay is proportional to distance
  // rather than to rank, so balloons at a similar radius go together and the
  // chain reads as one expanding front.
  function popWave(origin) {
    var color = origin.getAttribute("data-bday-color");
    var o = origin.getBoundingClientRect();
    var ox = o.left + o.width / 2;
    var oy = o.top + o.height / 2;

    var all = layer.querySelectorAll('.bday_balloon[data-bday-color="' + color + '"]');

    // Two passes on purpose. data-bday-popping drives a CSS rule, so writing it
    // invalidates style — interleaving that with getBoundingClientRect() forced
    // a fresh layout on every iteration. Read everything, then write everything.
    var targets = [];
    var speed = CONFIG.wavePxPerMs;
    var instant = reduceMq.matches;

    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (el.getAttribute("data-bday-popping") === "1") continue;
      var r = el.getBoundingClientRect();
      var dx = r.left + r.width / 2 - ox;
      var dy = r.top + r.height / 2 - oy;
      targets.push({
        el: el,
        delay: instant ? 0 : Math.sqrt(dx * dx + dy * dy) / speed
      });
    }

    for (var j = 0; j < targets.length; j++) {
      var t = targets[j];
      t.el.setAttribute("data-bday-popping", "1");
      popped[t.el.getAttribute("data-bday-cell")] = true;
      (function (target, delay) {
        later(function () { popOne(target); }, delay);
      })(t.el, t.delay);
    }
  }

  function onClick(e) {
    var img = e.target;
    if (!img || !img.classList || !img.classList.contains("bday_balloon")) return;
    popWave(img);
  }

  function fill() {
    var w = layer.clientWidth;
    var h = layer.clientHeight;

    var g = grid(w, h);
    var cols = g.cols, rows = g.rows;
    var cellW = w / cols, cellH = h / rows;

    var frag = document.createDocumentFragment();
    var made = 0;
    // Hoisted: these were read from CONFIG once per cell, up to 100 times.
    var jitter = CONFIG.jitterRatio, maxTilt = CONFIG.maxTilt;
    var nColors = COLORS.length;

    for (var row = 0; row < rows; row++) {
      for (var col = 0; col < cols; col++) {
        // A popped cell stays popped. Without this a resize rebuilds the field
        // and every balloon the user already popped comes back.
        if (popped[col + "," + row]) continue;

        // Brick layout — distributes more evenly than a square grid at the same
        // count. Rows shift a quarter-cell in alternating directions rather than
        // every other row shifting right, which would bleed the field off the
        // right edge while leaving the left flush.
        var stagger = (row % 2 ? 1 : -1) * (cellW / 4);

        // +0.5 puts the balloon at the cell's centre, so the field is inset
        // from the edges rather than half-clipped against them.
        var x = (col + 0.5) * cellW + stagger +
                (rand(col, row, 1) * 2 - 1) * cellW * jitter;
        var y = (row + 0.5) * cellH +
                (rand(col, row, 2) * 2 - 1) * cellH * jitter;

        var color = COLORS[Math.floor(rand(col, row, 3) * nColors)];
        var tilt = (rand(col, row, 4) * 2 - 1) * maxTilt;

        // Random depth rather than DOM order, so the overlaps don't all fall
        // the same way down-and-right and give the grid away.
        var z = 1 + Math.floor(rand(col, row, 5) * Z_LEVELS);

        var img = document.createElement("img");
        img.className = "bday_balloon";
        img.src = srcFor(color, 1);
        img.alt = "";
        img.setAttribute("aria-hidden", "true");
        img.setAttribute("data-bday-color", color);
        img.setAttribute("data-bday-cell", col + "," + row);
        img.style.left = x.toFixed(1) + "px";
        img.style.top = y.toFixed(1) + "px";
        img.style.zIndex = z;
        // Only the tilt is set inline; the full transform is composed in CSS so
        // the :hover scale can apply on top of it.
        img.style.setProperty("--bday-tilt", tilt.toFixed(2) + "deg");

        frag.appendChild(img);
        made++;
      }
    }

    layer.textContent = "";
    layer.appendChild(frag);
    liveBalloons = made;
  }

  var lastCols = -1, lastRows = -1, lastW = -1, lastH = -1;

  function applyResize() {
    resizeRaf = null;
    var w = layer.clientWidth, h = layer.clientHeight;   // read once, not 4x
    // Measured zero: the fragment is hidden, or laid out later than init. Do
    // nothing and leave lastW/lastH untouched, so the ResizeObserver below
    // still sees a change when real dimensions arrive.
    if (!(w > 0) || !(h > 0)) return;
    var g = grid(w, h);
    // Cell size tracks the viewport continuously, so refill whenever the
    // dimensions change at all — not only when the row/column count does.
    if (g.cols === lastCols && g.rows === lastRows && w === lastW && h === lastH) return;
    lastCols = g.cols;
    lastRows = g.rows;
    lastW = w;
    lastH = h;
    // Rule lengths are measured off the viewport, so they go stale on a resize
    // that doesn't move the mouse.
    if (ptrLive) drawPointer();
    fill();
  }

  // Applied directly. rAF-coalescing was tried here to avoid rebuilding ~100
  // nodes per resize event, but it means nothing lays out until the browser
  // grants a frame — and a background tab never does, so a resize while hidden
  // silently never applies.
  var resizeRaf = null;
  function onResize() { applyResize(); }

  function applySize() {
    root.style.setProperty("--bday-balloon-size", CONFIG.balloonSize + "px");
  }

  // Rebuild from scratch. Tuning is a deliberate act, so it also clears the
  // popped set — cell keys stop meaning the same thing once the grid changes,
  // and a half-popped field would make the new settings hard to judge.
  function rebuild() {
    clearTimers();
    popped = Object.create(null);
    applySize();
    lastCols = lastRows = lastW = lastH = -1;
    applyResize();   // synchronous: callers expect the field to exist on return
  }

  applySize();
  applyResize();
  window.addEventListener("resize", onResize);

  // A window resize event is not enough. The fragment can be mounted inside a
  // hidden container (Liferay tab, accordion) or simply lay out after this
  // script runs — in both cases it measures 0 at init and no resize event ever
  // follows, so it would stay empty forever. Watching the element itself is the
  // playbook's "measure on open, not on init".
  var ro = null;
  if (window.ResizeObserver) {
    ro = new ResizeObserver(onResize);
    ro.observe(root);
  }
  layer.addEventListener("click", onClick);
  root.addEventListener("pointermove", onPointerMove);
  root.addEventListener("pointerout", onPointerOut);
  setPointer(CONFIG.pointer);
  preloadFrames();

  window.bday = {
    root: root,
    config: CONFIG,
    // Merge a patch of CONFIG values and rebuild. Used by preview.html's
    // tuning panel; also lets an integrator retune without editing the script.
    setConfig: function (patch) {
      for (var k in patch) {
        if (Object.prototype.hasOwnProperty.call(patch, k) &&
            Object.prototype.hasOwnProperty.call(CONFIG, k)) {
          CONFIG[k] = patch[k];
        }
      }
      rebuild();
      return CONFIG;
    },
    reset: rebuild,
    balloonsRemaining: balloonsRemaining,
    pointerModes: POINTER_MODES,
    setPointer: setPointer,

    // Quick state dump for debugging on a machine you can't attach to.
    diagnose: function () {
      var report = {
        // Suppresses the pop frame sequence entirely — commonly enabled by
        // policy on managed Windows machines.
        prefersReducedMotion: reduceMq.matches,
        balloonsInDom: layer.querySelectorAll(".bday_balloon").length,
        balloonsRemaining: balloonsRemaining(),
        layerSize: layer.clientWidth + "x" + layer.clientHeight,
        devicePixelRatio: window.devicePixelRatio || 1,
        pointerMode: CONFIG.pointer,
        userAgent: navigator.userAgent
      };
      try { console.log(report); } catch (e) {}
      return report;
    },
    destroy: function () {
      window.removeEventListener("resize", onResize);
      if (ro) { ro.disconnect(); ro = null; }
      layer.removeEventListener("click", onClick);
      root.removeEventListener("pointermove", onPointerMove);
      root.removeEventListener("pointerout", onPointerOut);
      if (ptrRaf !== null) cancelAnimationFrame(ptrRaf);
      ptrRaf = null;
      if (resizeRaf !== null) cancelAnimationFrame(resizeRaf);
      resizeRaf = null;
      clearTimers();
      if (root.parentNode) root.parentNode.removeChild(root);
      window.bday = null;
    }
  };
})();
</script>
